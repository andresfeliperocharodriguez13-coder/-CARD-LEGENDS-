<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>|League of Legends Card</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/perfil.css">

</head>

<body>


    <main id="pantallaPerfil">

        <div class="fondoMapa"></div>

        <section class="ventanaPerfil">

            <h1>CARD LEGENDS</h1>

            <h2>CREA TU PERFIL</h2>

            <p class="descripcion">
                Elige tu nombre y tu campeón favorito
            </p>


            <div class="campoNombre">

                <label for="nombreJugador">
                    Nombre del jugador
                </label>

                <input
                    type="text"
                    id="nombreJugador"
                    placeholder="Escribe tu nombre..."
                    maxlength="15"
                >

            </div>


            <h3>ELIGE TU AVATAR</h3>

            <div id="avatares">

                <div class="avatar" data-avatar="avatar1">

                    <img
                        src="img/avatares/avatar1.jpg"
                        alt="Avatar 1"
                    >

                </div>


                <div class="avatar" data-avatar="avatar2">

                    <img
                        src="img/avatares/avatar2.jpg"
                        alt="Avatar 2"
                    >

                </div>


                <div class="avatar" data-avatar="avatar3">

                    <img
                        src="img/avatares/avatar3.jpg"
                        alt="Avatar 3"
                    >

                </div>


                <div class="avatar" data-avatar="avatar4">

                    <img
                        src="img/avatares/avatar4.jpg"
                        alt="Avatar 4"
                    >

                </div>


                <div class="avatar" data-avatar="avatar5">

                    <img
                        src="img/avatares/avatar5.jpg"
                        alt="Avatar 5"
                    >

                </div>


                <div class="avatar" data-avatar="avatar6">

                    <img
                        src="img/avatares/avatar6.jpg"
                        alt="Avatar 6"
                    >

                </div>


                <div class="avatar" data-avatar="avatar7">

                    <img
                        src="img/avatares/avatar7.jpg"
                        alt="Avatar 7"
                    >

                </div>


                <div class="avatar" data-avatar="avatar8">

                    <img
                        src="img/avatares/avatar8.jpg"
                        alt="Avatar 8"
                    >

                </div>

            </div>


            <p id="mensajePerfil"></p>


            <button id="crearPerfil">

                CREAR PERFIL

            </button>

        </section>

    </main>

    <section id="pantallaCartas">

        <h1>COLECCIÓN DE CAMPEONES</h1>

    </section>

    <section id="pantallaBatalla">
        <h1>BATALLA</h1>

    </section>
    <script src="js/datos.js"></script>
    <script src="js/perfil.js"></script>
    <script src="js/cartas.js"></script>
    <script src="js/batalla.js"></script>
    <script src="js/main.js"></script>

</body>
</html>
