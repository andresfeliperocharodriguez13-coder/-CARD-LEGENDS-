<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>League of Legends Card</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/perfil.css">
    <link rel="stylesheet" href="css/cartas.css"> <!-- <-- Asegúrate de incluir esta línea -->
</head>
<body>
    <!-- PANTALLA 1: PERFIL -->
    <main id="pantallaPerfil">
        <div class="fondoMapa"></div>
        <section class="ventanaPerfil">
            <h1>CARD LEGENDS</h1>
            <h2>CREA TU PERFIL</h2>
            <div class="campoNombre">
                <label for="nombreJugador">Nombre de Invocador</label>
                <input type="text" id="nombreJugador" placeholder="Escribe tu nombre..." maxlength="15">
            </div>
            <h3>Elige tu avatar</h3>
            <div id="avatares">
                <!-- Tus avatares existentes -->
            </div>
            <div id="mensajePerfil"></div>
            <button id="crearPerfil">Comenzar</button>
        </section>
    </main>

    <!-- PANTALLA 2: SELECCIÓN DE CARTAS Y MAZO (ESTO FALTABA) -->
    <section id="pantallaCartas">
        <div class="fondoMapa"></div>
        <div class="contenedor-cartas-general">
            <h2>COLECCIÓN DE CAMPEONES</h2>
            <p class="instruccion-cartas">Elige 5 cartas para armar tu mazo de batalla</p>
            
            <!-- Grilla donde se cargarán las 20 cartas -->
            <div id="gridCartas" class="grid-cartas"></div>

            <!-- Sección inferior del Mazo -->
            <div class="seccion-mazo">
                <h3>TU MAZO DE BATALLA (0/5)</h3>
                <div id="slotMazoContainer" class="slot-mazo-container"></div>
                <button id="btnConfirmarMazo" type="button">Confirmar Mazo y Comenzar Batalla</button>
            </div>
        </div>
    </section>

    <!-- PANTALLA 3: BATALLA (Próxima fase) -->
    <section id="pantallaBatalla" style="display: none;">
        <!-- Aquí irá la batalla -->
    </section>

    <!-- Scripts -->
    <script src="js/datos.js"></script>
    <script src="js/perfil.js"></script>
    <script src="js/cartas.js"></script>

    
</body>
</html>
